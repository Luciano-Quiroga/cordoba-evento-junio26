<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistentes — Córdoba 24 jun</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0D1B2A;
    color: #E8EDF2;
    min-height: 100vh;
    padding: 0;
  }

  .page {
    max-width: 420px;
    margin: 0 auto;
    padding: 0 0 2rem;
  }

  /* Header */
  .top-bar {
    background: #0D1B2A;
    padding: 1.5rem 1.25rem 1rem;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .eyebrow {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #4A9EDB;
    margin-bottom: 6px;
  }

  .event-name {
    font-size: 20px;
    font-weight: 600;
    color: #F0F4F8;
    line-height: 1.3;
    margin-bottom: 10px;
  }

  .meta-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #7A9BB5;
    margin-bottom: 4px;
  }

  .meta-row svg {
    flex-shrink: 0;
    opacity: 0.7;
  }

  /* Total hero */
  .total-section {
    padding: 1.5rem 1.25rem 1rem;
  }

  .total-card {
    background: #185FA5;
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .total-num {
    font-size: 52px;
    font-weight: 700;
    color: #E6F1FB;
    line-height: 1;
  }

  .total-label {
    font-size: 13px;
    color: #85B7EB;
    margin-top: 4px;
  }

  .total-icon {
    opacity: 0.35;
  }

  /* Categories */
  .section-label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #4A6B85;
    padding: 0 1.25rem;
    margin-bottom: 10px;
  }

  .rows {
    padding: 0 1rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .row {
    background: #132336;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .row-name {
    font-size: 14px;
    color: #A8C0D6;
  }

  .row-count {
    font-size: 22px;
    font-weight: 600;
    color: #E8EDF2;
    min-width: 28px;
    text-align: right;
  }

  .row-count.zero {
    color: #3A5570;
  }

  .row-bar-wrap {
    flex: 1;
    margin: 0 12px;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .row-bar {
    height: 100%;
    background: #185FA5;
    border-radius: 2px;
    transition: width 0.6s ease;
  }

  /* Footer */
  .footer {
    padding: 1.25rem 1.25rem 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #1D9E75;
    display: inline-block;
    margin-right: 6px;
  }

  .status-dot.loading {
    background: #4A6B85;
  }

  .status-txt {
    font-size: 12px;
    color: #4A6B85;
  }

  .refresh-btn {
    font-size: 12px;
    color: #4A9EDB;
    background: none;
    border: 1px solid rgba(74,158,219,0.25);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }

  .refresh-btn:active {
    opacity: 0.7;
  }

  .error-box {
    margin: 1rem 1.25rem;
    background: rgba(162, 45, 45, 0.2);
    border: 1px solid rgba(162, 45, 45, 0.4);
    border-radius: 10px;
    padding: 0.85rem 1rem;
    font-size: 13px;
    color: #F09595;
  }

  .countdown-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0.75rem 1rem 0;
    background: #0F2337;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 10px;
    padding: 0.75rem 1rem;
  }

  .countdown-days {
    font-size: 28px;
    font-weight: 700;
    color: #4A9EDB;
    min-width: 36px;
  }

  .countdown-days.urgent {
    color: #EF9F27;
  }

  .countdown-days.today {
    color: #1D9E75;
  }

  .countdown-text {
    font-size: 13px;
    color: #7A9BB5;
    line-height: 1.4;
  }

  .countdown-text strong {
    color: #A8C0D6;
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="page">

  <div class="top-bar">
    <p class="eyebrow">Resumen de inscriptos</p>
    <h1 class="event-name">Presentación "Cambia la Música"</h1>
    <div class="meta-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Holiday Inn Córdoba · Salón Cerro
    </div>
    <div class="meta-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Miércoles 24 de junio · 16:45 hs
    </div>
  </div>

  <div id="main-content">
    <div class="total-section">
      <div class="total-card">
        <div>
          <div class="total-label">Cargando...</div>
          <div class="total-num">—</div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">
    <div>
      <span class="status-dot loading" id="dot"></span>
      <span class="status-txt" id="status-txt">Conectando...</span>
    </div>
    <button class="refresh-btn" onclick="loadData()">↻ Actualizar</button>
  </div>

</div>

<script>
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQnWUx8MBE2H4wxNnExbn4C9tpuyPfvIzX6BKJ2INl1nkgB4ibEpQVuloNAghyHIuUt6nlR9F1kZPLY/pub?gid=1040068926&single=true&output=csv';

const EVENT_DATE = new Date('2026-06-24T16:45:00-03:00');

function getDaysLeft() {
  const now = new Date();
  const diff = EVENT_DATE - now;
  if (diff <= 0) return 0;
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}

function countdownHTML() {
  const days = getDaysLeft();
  let cls = 'countdown-days';
  let msg = '';
  if (days === 0) {
    cls += ' today';
    msg = '<strong>¡Es hoy!</strong> El evento comienza a las 16:45 hs.';
  } else if (days <= 3) {
    cls += ' urgent';
    msg = `Faltan <strong>${days} día${days > 1 ? 's' : ''}</strong> para el evento · 24 jun · 16:45 hs`;
  } else {
    msg = `Faltan <strong>${days} días</strong> para el evento · 24 jun · 16:45 hs`;
  }
  return `<div class="countdown-row">
    <div class="${cls}">${days}</div>
    <div class="countdown-text">${msg}</div>
  </div>`;
}

function parseCSV(text) {
  return text.split('\n').map(r => r.split(',').map(c => c.trim().replace(/^"|"$/g, '')));
}

async function loadData() {
  const dot = document.getElementById('dot');
  const statusTxt = document.getElementById('status-txt');
  dot.className = 'status-dot loading';
  statusTxt.textContent = 'Actualizando...';

  try {
    const res = await fetch(CSV_URL + '&t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const raw = await res.text();
    const rows = parseCSV(raw);

    // CSV de Hoja 1: col0 vacía, col1 vacía, col2 = número, col3 = label
    // Filtramos filas que tengan número en col2 y texto en col3
    const allRows = rows.filter(r => r.length >= 4 && !isNaN(parseInt(r[2])) && r[3] && r[3].trim() !== '');

    // La última fila es el total (sin label en col3 o su número suma todo)
    // La detectamos como la que no tiene label descriptivo o viene sola al final
    // Estrategia: si hay una fila cuyo número coincide con la suma de las demás, es el total
    let dataRows = allRows;
    let finalTotal = 0;

    // Intentamos detectar fila de total: última fila donde el número >= suma del resto
    const sumAll = allRows.reduce((s, r) => s + (parseInt(r[2]) || 0), 0);
    const lastRow = allRows[allRows.length - 1];
    const lastVal = parseInt(lastRow[2]) || 0;
    const sumWithoutLast = sumAll - lastVal;
    if (lastVal === sumAll || lastVal === sumWithoutLast + lastVal && allRows.length > 1 && lastVal >= sumWithoutLast) {
      dataRows = allRows.slice(0, -1);
      finalTotal = lastVal;
    }
    if (!finalTotal) {
      finalTotal = dataRows.reduce((s, r) => s + (parseInt(r[2]) || 0), 0);
    }

    const counts = dataRows.map(r => parseInt(r[2]) || 0);
    const labels = dataRows.map(r => {
      const raw = r[3] || r[2] || '—';
      return raw.charAt(0).toUpperCase() + raw.slice(1).toLowerCase();
    });
    const maxCount = Math.max(...counts, 1);

    let html = '';

    html += `<div class="total-section">
      <div class="total-card">
        <div>
          <div class="total-label">Total inscriptos</div>
          <div class="total-num">${finalTotal}</div>
        </div>
        <svg class="total-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#E6F1FB" stroke-width="1.5">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
      </div>
      ${countdownHTML()}
    </div>`;

    html += `<p class="section-label">Por categoría</p>`;
    html += `<div class="rows">`;

    for (let i = 0; i < dataRows.length; i++) {
      const c = counts[i];
      const pct = Math.round((c / maxCount) * 100);
      html += `<div class="row">
        <span class="row-name">${labels[i]}</span>
        <div class="row-bar-wrap"><div class="row-bar" style="width:${pct}%"></div></div>
        <span class="row-count${c === 0 ? ' zero' : ''}">${c}</span>
      </div>`;
    }

    html += `</div>`;

    document.getElementById('main-content').innerHTML = html;
    dot.className = 'status-dot';
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    statusTxt.textContent = `Actualizado ${hh}:${mm} hs`;

  } catch (e) {
    document.getElementById('main-content').innerHTML = `<div class="error-box">No se pudieron cargar los datos. Verificá tu conexión e intentá de nuevo.</div>`;
    dot.className = 'status-dot loading';
    statusTxt.textContent = 'Error al cargar';
  }
}

loadData();
setInterval(loadData, 60000);
</script>
</body>
</html>
